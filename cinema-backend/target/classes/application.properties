# =============================================
# Cinema Backend - Application Configuration
# =============================================

spring.application.name=cinema-backend

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/cinema_db
spring.data.mongodb.database=cinema_db

# Server Port
server.port=8080

# Logging
logging.level.com.cinema=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# Jackson - serialize LocalDate/LocalDateTime
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
